stages:
  - test
  - build
  - deploy

variables:
  IMAGE_TAG: gcr.io/$GCP_PROJECT_ID/speech-to-text:$CI_COMMIT_SHORT_SHA

# Backend tests
test:backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest tests/ -v --cov=app
  only:
    - merge_requests
    - main

# Frontend tests
test:frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm test
  only:
    - merge_requests
    - main

# Build Docker image
build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $IMAGE_TAG .
    - echo $GCP_SERVICE_KEY | docker login -u _json_key --password-stdin https://gcr.io
    - docker push $IMAGE_TAG
  only:
    - main

# Deploy to Google Cloud Run
deploy:production:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo $GCP_SERVICE_KEY > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - |
      gcloud run deploy speech-to-text \
        --image $IMAGE_TAG \
        --platform managed \
        --region us-central1 \
        --allow-unauthenticated \
        --set-env-vars OPENAI_API_KEY=$OPENAI_API_KEY
  environment:
    name: production
    url: https://speech-to-text-xxx.run.app
  only:
    - main