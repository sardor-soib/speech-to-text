stages:
  - test
  - build
  - deploy

variables:
  IMAGE_TAG_BACKEND: gcr.io/$GCP_PROJECT_ID/speech-to-text-backend:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_FRONTEND: gcr.io/$GCP_PROJECT_ID/speech-to-text-frontend:$CI_COMMIT_SHORT_SHA

# Backend tests
test:backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest tests/ -v --cov=app
  only:
    - merge_requests
    - main

# Build Backend Docker image using Google Cloud Build (non-interactive)
build:backend:
  stage: build
  image: google/cloud-sdk:slim
  script:
    - echo "$GCP_SERVICE_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file=${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud services enable cloudbuild.googleapis.com
    - gcloud builds submit --tag $IMAGE_TAG_BACKEND backend
  only:
    - main

# Build Frontend Docker image using Google Cloud Build (non-interactive)
build:frontend:
  stage: build
  image: google/cloud-sdk:slim
  script:
    - echo "$GCP_SERVICE_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file=${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - gcloud services enable cloudbuild.googleapis.com
    - gcloud builds submit --tag $IMAGE_TAG_FRONTEND frontend
  only:
    - main

# Deploy Backend to Google Cloud Run
deploy:backend:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "$GCP_SERVICE_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - |
      gcloud run deploy speech-to-text-backend \
        --image $IMAGE_TAG_BACKEND \
        --platform managed \
        --region us-central1 \
        --allow-unauthenticated \
        --port 8080 \
        --timeout 300 \
        --memory 1Gi \
        --max-instances 10 \
        --min-instances 0 \
        --cpu 1 \
        --concurrency 80 \
        --set-env-vars OPENAI_API_KEY=$OPENAI_API_KEY,PORT=8080
    - echo "Backend deployed at:"
    - gcloud run services describe speech-to-text-backend --region=us-central1 --format='value(status.url)'
  environment:
    name: production
    url: https://speech-to-text-backend-xxx-uc.a.run.app
  only:
    - main

# Deploy Frontend to Google Cloud Run
deploy:frontend:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - echo "$GCP_SERVICE_KEY" | base64 -d > ${HOME}/gcp-key.json
    - gcloud auth activate-service-account --key-file ${HOME}/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - |
      gcloud run deploy speech-to-text-frontend \
        --image $IMAGE_TAG_FRONTEND \
        --platform managed \
        --region us-central1 \
        --allow-unauthenticated \
        --port 8080 \
        --timeout 300 \
        --memory 512Mi \
        --max-instances 10 \
        --min-instances 0 \
        --cpu 1 \
        --concurrency 80 \
        --set-env-vars PORT=8080
    - echo "Frontend deployed at:"
    - gcloud run services describe speech-to-text-frontend --region=us-central1 --format='value(status.url)'
  environment:
    name: production
    url: https://speech-to-text-frontend-xxx-uc.a.run.app
  only:
    - main